# Configuração do Fly.io para Datarum (Frontend + Backend)
app = "datarum-app"
primary_region = "gru"  # São Paulo - mais próximo do Brasil

[build]

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Configuração de health check
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "5s"
      interval = "30s"
      method = "GET"
      path = "/health"
      protocol = "http"
      timeout = "5s"
      tls_skip_verify = false

  # Headers de segurança
  [[http_service.http_options.response.headers]]
    name = "X-Frame-Options"
    value = "DENY"
  
  [[http_service.http_options.response.headers]]
    name = "X-Content-Type-Options"
    value = "nosniff"

  [[http_service.http_options.response.headers]]
    name = "X-XSS-Protection"
    value = "1; mode=block"

# Configuração da máquina virtual
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Configuração de volume para arquivos temporários (opcional)
[[mounts]]
  source = "datarum_tmp"
  destination = "/tmp"

# Configuração de scaling automático
[metrics]
  port = 8000
  path = "/health"

# Deploy settings
[[services]]
  protocol = "tcp"
  internal_port = 8000

  # Load balancer
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Health checks
  [[services.tcp_checks]]
    grace_period = "5s"
    interval = "30s"
    restart_limit = 0
    timeout = "10s"

  [[services.http_checks]]
    interval = "30s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"
    restart_limit = 0
    timeout = "10s"
    tls_skip_verify = false

# Configurações de região e backup
[[services.regions]]
  primary = "gru"

# Configuração de logs
[logging]
  level = "info"
  format = "json"