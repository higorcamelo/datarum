# fly.toml app configuration file generated for sigonota-web on 2025-07-23T17:34:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sigonota-web'
primary_region = 'gig'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
