# Configuração do Fly.io para Sigonota (API)
app = "sigonota-api"
primary_region = "gru"

[build]

[env]
  ENVIRONMENT = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # Configuração de health check
  [http_service.checks]
    [http_service.checks.health]
      grace_period = "5s"
      interval = "30s"
      method = "GET"
      path = "/health"
      protocol = "http"
      timeout = "5s"

# Configuração da máquina virtual
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512